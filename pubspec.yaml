name: snapbooth
description: "A Flutter Web Photobooth optimized for iPad."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Web Interop & Compatibility
  web: ^0.5.1
  flutter_web_plugins:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # UI & Aesthetic
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Networking
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ensure your assets are registered here as you add them[cite: 1]
  # assets:
  #   - assets/images/