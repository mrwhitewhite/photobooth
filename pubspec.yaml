name: myreceipt
description: "A Flutter Android Photobooth"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # UI & Aesthetic
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Native Camera, Video, Bluetooth, Image Processing
  camera: ^0.11.0
  video_player: ^2.9.0
  image: ^4.2.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0
  shared_preferences: ^2.5.5
  flutter_xprinter_sdk: ^0.1.1
  mailer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/homepage.png
    - assets/layout_selection.png
    - assets/layout/1x1.png
    - assets/layout/2x1_camera.png
    - assets/layout/2x2.PNG
    - assets/layout/3x1.png
    - assets/layout/4x2.png
    - assets/video/start_video.mp4
    - assets/video/homepage_vid.mp4

  fonts:
    - family: CHAOS16
      fonts:
        - asset: assets/fonts/CHAOS16.otf
    - family: PoppinsMedium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Rascal
      fonts:
        - asset: assets\fonts\RASCAL.TTF
