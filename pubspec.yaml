name: snapbooth
description: "A Flutter Web Photobooth PWA optimized for iPad Pro."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # UI & Aesthetic
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Printing
  blue_thermal_printer: ^1.2.3

  # Camera
  camera: ^0.11.0+2

  # Video Playback
  video_player: ^2.9.2

  # File System & Gallery
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^4.0.1

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/homepage.png
    - assets/layout_selection.png
    - assets/layout/1x1.png
    - assets/layout/2x1_camera.png
    - assets/layout/2x2.PNG
    - assets/layout/3x1.png
    - assets/layout/4x2.png
    - assets/screen_saver/screen_saver_1.mov
    - assets/screen_saver/screen_saver_2.mov

  fonts:
    - family: CHAOS16
      fonts:
        - asset: assets/fonts/CHAOS16.otf
    - family: PoppinsMedium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500